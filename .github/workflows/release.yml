name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build source tarball
        run: |
          NAME="opencode-ipad-relay-${GITHUB_REF_NAME}"
          # Package exactly the tracked files (no caches, no local secrets).
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          shasum -a 256 "${NAME}.tar.gz" >SHA256SUMS.txt
          echo "=== contents ==="
          tar -tzf "${NAME}.tar.gz"
          echo "=== checksums ==="
          cat SHA256SUMS.txt

      # gh is preinstalled on the runner, so there is no third-party action
      # here to pin, review or keep up to date.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "opencode-ipad-relay-${GITHUB_REF_NAME}.tar.gz" \
            SHA256SUMS.txt
