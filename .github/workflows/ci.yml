name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those aimed at main: work is often split
  # into a stack of small PRs, each based on the one before, and those were
  # getting no checks at all until they were retargeted.
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both tools are downloaded and checked against a known hash. The
      # previous version piped a script from a branch straight into sudo
      # bash, and took the shfmt binary on trust.
      - name: Install bash lint tools
        env:
          SHFMT_VERSION: 3.11.0
          SHFMT_SHA256: 1904ec6bac715c1d05cd7f6612eec8f67a625c3749cb327e5bfb4127d09035ff
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

          curl -sSfLo /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

          curl -sSfLo /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh src/opencode-web scripts/check.sh

      - name: shfmt
        run: shfmt -i 2 -d install.sh uninstall.sh src/opencode-web scripts/check.sh

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dev tools
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format
        run: ruff format --check src/ tests/

      - name: mypy
        run: mypy src/opencode-web-proxy.py --ignore-missing-imports

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the PR's commit range; shallow clones break it

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: bandit
        run: |
          pip install -r requirements-dev.txt
          bandit -r src/ -q

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          pip install -r requirements-dev.txt
          brew install bats-core

      - name: pytest
        run: python -m pytest tests/python/ --cov=src --cov-report=term-missing

      - name: bats
        run: bats tests/bats/

      # Most people will run this under the python3 that comes with macOS,
      # not a Homebrew one. That's an older interpreter linked against
      # LibreSSL rather than OpenSSL, and it has already caught one bug the
      # 3.13 run missed.
      - name: pytest on the python macOS ships
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/python3 ]; then
            echo "no /usr/bin/python3 on this runner — skipping"
            exit 0
          fi
          /usr/bin/python3 -c 'import sys, ssl; print(sys.version, ssl.OPENSSL_VERSION)'
          /usr/bin/python3 -m venv "$RUNNER_TEMP/stock"
          "$RUNNER_TEMP/stock/bin/python" -m pip install --quiet --disable-pip-version-check pytest==8.3.5
          "$RUNNER_TEMP/stock/bin/python" -m pytest tests/python/ -o addopts= -q
