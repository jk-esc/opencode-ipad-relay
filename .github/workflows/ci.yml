name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install bash lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # shfmt
          curl -sSLo /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          # actionlint
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | sudo bash -s -- 1.7.12 /usr/local/bin

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh src/opencode-web scripts/check.sh

      - name: shfmt
        run: shfmt -i 2 -d install.sh uninstall.sh src/opencode-web scripts/check.sh

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Python dev tools
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format
        run: ruff format --check src/ tests/

      - name: mypy
        run: mypy src/opencode-web-proxy.py --ignore-missing-imports

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: bandit
        run: |
          pip install bandit==1.8.3
          bandit -r src/ -q

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24fb42907128877770baf # v2.3.9

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          pip install -r requirements-dev.txt
          brew install bats-core

      - name: pytest
        run: python -m pytest tests/python/ --cov=src --cov-report=term-missing

      - name: bats
        run: bats tests/bats/
